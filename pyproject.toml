[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plainly"
version = "0.1.0"
description = "Local server that scores whether a sentence is plain English."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["laya==0.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
